[workspace]
resolver = "2"
members = [
    "crates/workstation-core",
    "crates/workstation-policy",
    "crates/workstation-audit",
    "crates/workstation-index",
    "crates/workstation-executor",
    "crates/workstation-server",
    "crates/workstation-elevated-helper",
    "src-tauri",
    "tests",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
repository = "https://github.com/CaiCheng-Li/Local-Pilot"
publish = false

[workspace.dependencies]
workstation-core = { path = "crates/workstation-core" }
workstation-policy = { path = "crates/workstation-policy" }
workstation-audit = { path = "crates/workstation-audit" }
workstation-index = { path = "crates/workstation-index" }
workstation-executor = { path = "crates/workstation-executor" }
workstation-server = { path = "crates/workstation-server" }

anyhow = "1"
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1.47", features = ["full"] }
tokio-util = { version = "0.7", features = ["rt"] }
futures = "0.3"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
tracing-appender = "0.2"
parking_lot = "0.12"
chrono = { version = "0.4", features = ["serde"] }
ulid = "1"
rand = "0.9"
sha2 = "0.10"
hmac = "0.12"
subtle = "2"
base64 = "0.22"
hex = "0.4"
regex = "1"
globset = "0.4"
ignore = "0.4"
url = "2"
bytes = "1"
http = "1"
http-body = "1"
http-body-util = "0.1"
pin-project-lite = "0.2"
axum = "0.8"
tower = { version = "0.5", features = ["util"] }
rusqlite = { version = "0.37", features = ["bundled"] }
schemars = "1"
rmcp = { version = "3.4", default-features = false, features = ["server", "macros", "transport-streamable-http-server"] }
notify = "8"
grep-searcher = "0.1"
grep-regex = "0.1"
grep-matcher = "0.1"
percent-encoding = "2"
tempfile = "3"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
windows-sys = { version = "0.61", features = [
    "Wdk_Foundation",
    "Wdk_Storage_FileSystem",
    "Wdk_System_SystemServices",
    "Win32_Foundation",
    "Win32_Globalization",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_Security_Cryptography",
    "Win32_Storage_FileSystem",
    "Win32_System_Com",
    "Win32_System_Console",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_Environment",
    "Win32_System_IO",
    "Win32_System_Ioctl",
    "Win32_System_JobObjects",
    "Win32_System_Kernel",
    "Win32_System_Memory",
    "Win32_System_Pipes",
    "Win32_System_ProcessStatus",
    "Win32_System_Registry",
    "Win32_System_SystemServices",
    "Win32_System_Threading",
    "Win32_System_WindowsProgramming",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }

[profile.release]
lto = "thin"
codegen-units = 4
strip = "symbols"
panic = "unwind"
